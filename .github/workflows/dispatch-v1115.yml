name: Dispatch v1.11.5 release

# One-shot: git push from this machine has no GitHub credentials.
# This push to main starts the Release workflow, which publishes v1.11.5 and npm.
on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, 'v1.11.5 ad-hoc sign')
    runs-on: ubuntu-latest
    steps:
      - name: Start Release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run Release --ref main -f tag=v1.11.5
