name: Dispatch v1.11.5 release

# One-shot for the v1.11.5 main push. package-lock is synced here because
# the lockfile is too large to send through the GitHub contents API in one call.
on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, 'v1.11.5 ad-hoc sign')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync package-lock version
        run: |
          PKG=$(node -p "require('./package.json').version")
          LOCK=$(node -p "require('./package-lock.json').version")
          echo "package=$PKG lock=$LOCK"
          if [ "$PKG" != "$LOCK" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npm version "$PKG" --no-git-tag-version --allow-same-version
            git add package.json package-lock.json
            git commit -m "chore: sync package-lock to $PKG"
            git push
          fi
      - name: Start CI and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run CI --ref main
          gh workflow run Release --ref main -f tag=v1.11.5
